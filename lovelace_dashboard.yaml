title: Magister
views:
- title: Rooster & Cijfers
  path: magister
  icon: mdi:school
  cards:
  - type: glance
    title: Vandaag
    entities:
    - entity: sensor.magister_lieke_neuzen_magister_lieke_neuzen
      name: Lessen vandaag
      icon: mdi:school
    - entity: sensor.magister_lieke_neuzen_magister_lieke_neuzen_huiswerk
      name: Huiswerk
      icon: mdi:book-open-page-variant
    - entity: >-
        sensor.magister_lieke_neuzen_magister_lieke_neuzen_roosterwijzigingen
      name: Wijzigingen
      icon: mdi:calendar-alert
    - entity: sensor.magister_lieke_neuzen_magister_lieke_neuzen_cijfers
      name: Laatste cijfer
      icon: mdi:school-outline
  - type: markdown
    title: Volgende les
    content: >
      {% set e = 'sensor.magister_lieke_neuzen_magister_lieke_neuzen_volgende_afspraak' %} {% if states(e) == 'Geen' %}
        Geen komende lessen gevonden.
      {% else %}
        **{{ state_attr(e, 'subject') }}**
        📍 {{ state_attr(e, 'location') | default('–') }}
        🕐 {{ state_attr(e, 'start') }}  →  {{ state_attr(e, 'end') }}
        📝 {{ state_attr(e, 'description') | default('') }}
      {% endif %}
  - type: markdown
    title: Aankomende toetsen / SO / MO (komende week)
    content: |
      {%- set hw = state_attr('sensor.magister_lieke_neuzen_magister_lieke_neuzen_huiswerk', 'huiswerk') -%}
      {%- set today = now().strftime('%Y-%m-%d') -%}
      {%- set deadline = (now() + timedelta(days=7)).strftime('%Y-%m-%d') -%}
      {%- set ns = namespace(items=[]) -%}
      {%- for h in (hw or []) -%}
        {%- if h.start is defined and h.start[:10] >= today and h.start[:10] <= deadline
              and h.type in ['toets', 'proeftoets', 'schoolexamen', 'mondeling'] -%}
          {%- set ns.items = ns.items + [h] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set sorted = ns.items | sort(attribute='start') -%}
      {%- if sorted | length == 0 -%}
      _Geen toetsen / SO / MO de komende week._ ✅
      {%- else -%}
      {%- for h in sorted -%}
      {%- if h.type == 'schoolexamen' -%}{%- set icon = '🎓' -%}{%- set label = 'SO' -%}
      {%- elif h.type == 'proeftoets' -%}{%- set icon = '📋' -%}{%- set label = 'Proefwerk' -%}
      {%- elif h.type == 'mondeling' -%}{%- set icon = '🎤' -%}{%- set label = 'Mondeling' -%}
      {%- else -%}{%- set icon = '📝' -%}{%- set label = 'Toets' -%}
      {%- endif -%}
      {{ icon }} **{{ h.subject }}** — {{ label }}
      📅 {{ as_local(as_datetime(h.start)).strftime('%d-%m') }} · 🕐 {{ as_local(as_datetime(h.start)).strftime('%H:%M') }}{% if h.location %} · 📍 {{ h.location }}{% endif %}
      {% if h.title and h.title != h.description %} 📌 {{ h.title }}{% endif %}
      {% if h.teachers %} 👤 {{ h.teachers }}{% endif %}
      {% if h.content %}
      📖 {{ h.content }}{% elif h.description %}
      📖 {{ h.description }}{% endif %}
      {% if not loop.last %}
      ---
      {% endif %}
      {% endfor -%}
      {%- endif %}
  - type: markdown
    title: Aankomend huiswerk (komende 14 dagen)
    content: |
      {%- set hw = state_attr('sensor.magister_lieke_neuzen_magister_lieke_neuzen_huiswerk', 'huiswerk') -%}
      {%- set today = now().strftime('%Y-%m-%d') -%}
      {%- set deadline = (now() + timedelta(days=7)).strftime('%Y-%m-%d') -%}
      {%- set ns = namespace(items=[]) -%}
      {%- for h in (hw or []) -%}
        {%- if h.start is defined and h.start[:10] >= today and h.start[:10] <= deadline
              and h.type == 'huiswerk' -%}
          {%- set ns.items = ns.items + [h] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set sorted = ns.items | sort(attribute='start') -%}
      {%- if sorted | length == 0 -%}
      _Geen huiswerk de komende 14 dagen._ 🎉
      {%- else -%}
      {%- for h in sorted -%}
      📚 **{{ h.subject }}**
      📅 {{ as_local(as_datetime(h.start)).strftime('%d-%m') }} · 🕐 {{ as_local(as_datetime(h.start)).strftime('%H:%M') }}{% if h.location %} · 📍 {{ h.location }}{% endif %}
      {% if h.title and h.title != h.description %} 📌 {{ h.title }}{% endif %}
      {% if h.teachers %} 👤 {{ h.teachers }}{% endif %}
      {% if h.content %}
      📖 {{ h.content }}{% elif h.description %}
      📖 {{ h.description }}{% endif %}
      {% if not loop.last %}
      ---
      {% endif %}
      {% endfor -%}
      {%- endif %}
  - type: markdown
    title: Cijfers afgelopen week
    content: |
      {%- set cijfers = state_attr('sensor.magister_lieke_neuzen_magister_lieke_neuzen_cijfers', 'cijfers') -%}
      {%- set week_ago = (now() - timedelta(days=7)).strftime('%Y-%m-%d') -%}
      {%- set recent = (cijfers or []) | selectattr('entered_on', 'defined') | selectattr('entered_on', 'ge', week_ago) | sort(attribute='entered_on', reverse=true) | list -%}
      {%- if recent | length == 0 -%}
      _Geen cijfers de afgelopen week._
      {%- else -%}
      {%- for g in recent -%}
      {%- set n = g.value | float(-1) -%}
      {%- set icon = '🟢' if n >= 5.5 else ('🔴' if n >= 1 else '📝') -%}
      {%- set w = ' _(' ~ g.weight ~ ')_' if g.weight else '' -%}
      {%- set meta = (g.entered_on[:10] if g.entered_on else '') ~ (' · ' ~ g.description if g.description else '') -%}
      {{ icon }} **{{ g.subject }}** — **{{ g.value }}**{{ w }}
      {{ meta }}

      {% endfor -%}
      {%- endif %}
  - type: markdown
    title: Recente cijfers (laatste 20)
    content: |
      {%- set cijfers = state_attr('sensor.magister_lieke_neuzen_magister_lieke_neuzen_cijfers', 'cijfers') -%}
      {%- set items = (cijfers or [])[:20] -%}
      {%- if items | length == 0 -%}
      _Geen cijfers beschikbaar._
      {%- else -%}
      {%- for g in items -%}
      {%- set n = g.value | float(-1) -%}
      {%- set icon = '🟢' if n >= 5.5 else ('🔴' if n >= 1 else '📝') -%}
      {%- set w = ' _(' ~ g.weight ~ ')_' if g.weight else '' -%}
      {%- set naam = g.subject_name if g.subject_name else g.subject -%}
      {%- set meta = (g.entered_on[:10] if g.entered_on else '') ~ (' · ' ~ g.description if g.description else '') -%}
      {{ icon }} **{{ naam }}** — **{{ g.value }}**{{ w }}
      {{ meta }}

      {% endfor -%}
      {%- endif %}
  - type: markdown
    title: Cijfers per periode
    content: |
      {%- set per_periode = state_attr('sensor.magister_lieke_neuzen_magister_lieke_neuzen_cijfers', 'cijfers_per_periode') -%}
      {%- if not per_periode or per_periode.keys() | list | length == 0 -%}
      _Geen cijfers per periode beschikbaar._
      {%- else -%}
      {%- for periode in per_periode.keys() | sort -%}
      {%- set grades = per_periode[periode] -%}
      {%- set ns = namespace(total=0.0, weight=0.0) -%}
      {%- for g in grades -%}
        {%- set n = g.value | float(-1) -%}
        {%- set w = g.weight | float(1) -%}
        {%- if n >= 1 -%}{%- set ns.total = ns.total + n * w -%}{%- set ns.weight = ns.weight + w -%}{%- endif -%}
      {%- endfor -%}
      {%- set avg = (ns.total / ns.weight) | round(1) if ns.weight > 0 else none -%}
      {%- set avg_icon = '🟢' if avg is not none and avg >= 5.5 else ('🔴' if avg is not none else '') -%}
      ### Periode {{ periode }} — {{ grades | length }} cijfer{{ 's' if grades | length != 1 else '' }}{% if avg is not none %} · gem. {{ avg_icon }} **{{ avg }}**{% endif %}

      {%- for g in grades | sort(attribute='entered_on', reverse=true) -%}
      {%- set n = g.value | float(-1) -%}
      {%- set icon = '🟢' if n >= 5.5 else ('🔴' if n >= 1 else '📝') -%}
      {%- set w = ' _(' ~ g.weight ~ ')_' if g.weight else '' -%}
      {%- set naam = g.subject_name if g.subject_name else g.subject -%}
      {%- set meta = (g.entered_on[:10] if g.entered_on else '') ~ (' · ' ~ g.description if g.description else '') -%}
      {{ icon }} **{{ naam }}** — **{{ g.value }}**{{ w }}
      {{ meta }}
      {% endfor %}
      {% if not loop.last %}---
      {% endif %}
      {%- endfor -%}
      {%- endif %}
  - type: markdown
    title: Gemiddelde per vak (alle perioden)
    content: |
      {%- set gem = state_attr('sensor.magister_lieke_neuzen_magister_lieke_neuzen_cijfers', 'gemiddelden') -%}
      {%- if not gem -%}
      _Geen gemiddelden beschikbaar._
      {%- else -%}
      {%- for vak in gem | sort -%}
      {%- set avg = gem[vak]['gemiddelde'] -%}
      {%- set icon = '🟢' if avg >= 5.5 else '🔴' -%}
      {{ icon }} **{{ gem[vak]['subject_name'] }}**: {{ avg }}
      {% endfor -%}
      {%- endif %}
  # Cijferverloop grafiek — vereist custom:apexcharts-card via HACS
  - type: custom:apexcharts-card
    header:
      show: true
      title: Cijferverloop
    graph_span: 2year
    update_interval: 15min
    apex_config:
      chart:
        type: scatter
        height: 300
      markers:
        size: 6
      tooltip:
        x:
          format: dd-MM-yyyy
      yaxis:
        min: 1
        max: 10
        decimals: 1
      annotations:
        yaxis:
          - y: 5.5
            borderColor: "#FF4560"
            strokeDashArray: 4
            label:
              text: Voldoende
              style:
                color: "#FF4560"
    series:
      - entity: sensor.magister_lieke_neuzen_magister_lieke_neuzen_cijfers
        name: Cijfer
        data_generator: |
          return (entity.attributes.cijfers || [])
            .filter(g => g.entered_on && parseFloat(g.value) >= 1 && parseFloat(g.value) <= 10)
            .sort((a, b) => new Date(a.entered_on) - new Date(b.entered_on))
            .map(g => [new Date(g.entered_on).getTime(), parseFloat(g.value)]);
  - type: markdown
    title: Absenties (afgelopen 4 weken)
    content: |
      {%- set abs = state_attr('sensor.magister_lieke_neuzen_magister_lieke_neuzen_absenties', 'absenties') -%}
      {%- set items = (abs or []) | sort(attribute='start', reverse=true) -%}
      {%- if items | length == 0 -%}
      _Geen absenties geregistreerd._ ✅
      {%- else -%}
      {%- for a in items -%}
      {%- if a.handled -%}{%- set status = '✅' -%}
      {%- else -%}{%- set status = '⏳' -%}
      {%- endif -%}
      {%- set d_start = as_local(as_datetime(a.start)).strftime('%d-%m-%Y') if a.start else '?' -%}
      {%- set d_end = as_local(as_datetime(a.end)).strftime('%d-%m-%Y') if a.end else '' -%}
      {{ status }} **{{ d_start }}**{%- if a.end and d_start != d_end %} → {{ d_end }}{% endif %}
      {%- if a.lesson %} · 📚 {{ a.lesson }}{% endif %}
      {%- if a.period %} · 🕐 {{ a.period }}{% endif %}
      {%- if a.reason %} · {{ a.reason }}{% endif %}
      {%- if a.description and a.description != a.reason %} · {{ a.description }}{% endif %}
      {%- if a.counts %} · _telt mee_{% endif %}
      {% if not loop.last %}
      ---
      {% endif %}
      {% endfor -%}
      {%- endif %}
  - type: markdown
    title: Roosterwijzigingen
    content: |
      {%- set wijzigingen = state_attr('sensor.magister_lieke_neuzen_magister_lieke_neuzen_roosterwijzigingen', 'wijzigingen') -%}
      {%- set items = (wijzigingen or []) | sort(attribute='start') -%}
      {%- if items | length == 0 -%}
      _Geen roosterwijzigingen._ ✅
      {%- else -%}
      {%- for w in items -%}
      {%- set d = '📅 ' ~ (w.start[:10] if w.start else '–') -%}
      {%- set loc = ' · 📍 ' ~ w.location if w.location else '' -%}
      {%- set desc = ' · ' ~ w.description if w.description else '' -%}
      ⚠️ **{{ w.subject }}**
      {{ d }}{{ loc }}{{ desc }}

      {% endfor -%}
      {%- endif %}
  - initial_view: dayGridDay
    type: calendar
    title: Rooster
    entities:
    - calendar.magister_lieke_neuzen_magister_lieke_neuzen_rooster
