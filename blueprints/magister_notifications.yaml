 
blueprint:
  name: "Magister – Leerling notificaties"
  description: >
    Vier automations voor een Magister-leerling:
    - Pushbericht bij nieuw cijfer
    - Pushbericht bij nieuwe absentie
    - Pushbericht bij uitgevallen les
    - Dagelijkse herinnering aankomende toetsen / SO / mondeling

    Vereist de Magister Custom Integration (ha-magister-custom).
    Maak voor elke leerling een aparte instantie aan.
  domain: automation

  input:
    student_name:
      name: "Leerlingnaam (voor berichten)"
      description: "Naam zoals die in pushberichten verschijnt."
      default: "Leerling"
      selector:
        text:

    notify_service:
      name: "Notificatieservice"
      description: >
        De notify-service voor pushberichten, bijv.
        'notify.mobile_app_iphone_van_alex'. Gebruik 'notify.notify' voor de standaardservice.
      default: "notify.notify"
      selector:
        text:

    daily_reminder_time:
      name: "Tijd dagelijkse herinnering"
      description: "Tijdstip waarop de dagelijkse toetsherinnering verstuurd wordt."
      default: "07:00:00"
      selector:
        time:

    reminder_days_ahead:
      name: "Aankondigingsvenster toetsen (dagen)"
      description: "Hoeveel dagen vooruit toetsen / SO / mondelingen worden meegenomen in de herinnering."
      default: 7
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: dagen

    cijfers_sensor:
      name: "Magister cijfers sensor"
      description: "Sensor die de cijfers (en attribuut 'cijfers') bevat."
      selector:
        entity:
          domain: sensor

    absenties_sensor:
      name: "Magister absenties sensor"
      description: "Sensor die absenties (en attribuut 'absenties') bevat."
      selector:
        entity:
          domain: sensor

    magister_sensor:
      name: "Magister basis sensor"
      description: "Sensor met attribuut 'uitval_vandaag'."
      selector:
        entity:
          domain: sensor

    huiswerk_sensor:
      name: "Magister huiswerk sensor"
      description: "Sensor met attribuut 'huiswerk'."
      selector:
        entity:
          domain: sensor

# ============================================================
# Triggers
# ============================================================
trigger:
  - platform: state
    entity_id: !input cijfers_sensor
    id: nieuw_cijfer

  - platform: state
    entity_id: !input absenties_sensor
    id: nieuwe_absentie

  - platform: state
    entity_id: !input magister_sensor
    attribute: uitval_vandaag
    id: les_uitgevallen

  - platform: time
    at: !input daily_reminder_time
    id: dagelijkse_herinnering

# ============================================================
# Variables
# ============================================================
variables:
  naam: !input student_name
  notify: !input notify_service
  dagen: !input reminder_days_ahead

  cijfers_entity: !input cijfers_sensor
  absenties_entity: !input absenties_sensor
  magister_entity: !input magister_sensor
  huiswerk_entity: !input huiswerk_sensor

  # Helper: maak van een state altijd een getal; tekst => 0
  # Gebruik: {{ num(trigger.to_state.state) }}
  num: >
    {% macro num(s) -%}
      {%- set v = (s | string) -%}
      {%- if v in ['unknown','unavailable','–','', 'None', 'none'] -%}
        0
      {%- else -%}
        {{ v | float(0) }}
      {%- endif -%}
    {%- endmacro -%}
    {{ num }}

condition: []

# ============================================================
# Actions
# ============================================================
action:
  - choose:

      # ----------------------------------------------------------
      # 1. Nieuw cijfer
      # ----------------------------------------------------------
      - conditions:
          - condition: trigger
            id: nieuw_cijfer

          # Trigger alleen bij echte verandering; tekstwaarden worden toegestaan
          # maar we onderdrukken pure "non-state" ruis.
          - condition: template
            value_template: >
              {% set new = trigger.to_state.state if trigger.to_state else '' %}
              {% set old = trigger.from_state.state if trigger.from_state else '' %}
              {{ new != old and new not in ['unknown','unavailable',''] }}

        sequence:
          - service: "{{ notify }}"
            data:
              title: "📝 Nieuw cijfer – {{ naam }}"
              message: >
                {%- set cijfers = state_attr(cijfers_entity, 'cijfers') -%}
                {%- set g = cijfers[0] if cijfers else none -%}
                {%- if g -%}
                {{ g.subject }}: {{ g.value -}}
                {%- if g.weight %} (weging: {{ g.weight }}){% endif %}
                {%- if g.description %} — {{ g.description }}{% endif %}
                {%- if g.entered_on %}
                Ingevoerd: {{ g.entered_on[:10] }}{%- endif %}
                {%- else -%}
                Nieuw cijfer: {{ trigger.to_state.state }}
                {%- endif %}

      # ----------------------------------------------------------
      # 2. Nieuwe absentie
      # ----------------------------------------------------------
      - conditions:
          - condition: trigger
            id: nieuwe_absentie

          # Tekst => 0, dus dit blijft stabiel
          - condition: template
            value_template: >
              {% set new = trigger.to_state.state if trigger.to_state else '' %}
              {% set old = trigger.from_state.state if trigger.from_state else '' %}
              {{ (new | float(0)) > (old | float(0)) }}

        sequence:
          - service: "{{ notify }}"
            data:
              title: "⚠️ Absentie gemeld – {{ naam }}"
              message: >
                {%- set abs = state_attr(absenties_entity, 'absenties') -%}
                {%- set a = abs[0] if abs else none -%}
                {%- if a -%}
                Datum: {{ as_local(as_datetime(a.start)).strftime('%d-%m-%Y') if a.start else '?' -}}
                {%- if a.lesson %} · {{ a.lesson }}{% endif %}
                {%- if a.period %} · {{ a.period }}{% endif %}
                {%- if a.reason %} · {{ a.reason }}{% endif %}
                {%- if a.description and a.description != a.reason %} · {{ a.description }}{% endif %}

                {{ '✅ Afgehandeld' if a.handled else '⏳ Nog niet afgehandeld' -}}
                {%- if a.counts %} · telt mee{% endif %}
                {%- else -%}
                Er is een nieuwe absentie geregistreerd.
                {%- endif %}

      # ----------------------------------------------------------
      # 3. Les uitgevallen
      # ----------------------------------------------------------
      - conditions:
          - condition: trigger
            id: les_uitgevallen

          - condition: template
            value_template: >
              {% set new_list = trigger.to_state.attributes.uitval_vandaag if trigger.to_state else [] %}
              {% set old_list = trigger.from_state.attributes.uitval_vandaag if trigger.from_state else [] %}
              {{ (new_list | default([]) | length) > (old_list | default([]) | length) }}

        sequence:
          - service: "{{ notify }}"
            data:
              title: "❌ Les uitgevallen – {{ naam }}"
              message: >
                {%- set uitval = state_attr(magister_entity, 'uitval_vandaag') or [] -%}
                {%- if uitval | length == 0 -%}
                Er is een les uitgevallen.
                {%- else -%}
                {%- for les in uitval -%}
                {{ les.subject -}}
                {%- if les.start %} om {{ as_local(as_datetime(les.start)).strftime('%H:%M') }}{% endif -%}
                {%- if les.location %} ({{ les.location }}){% endif %}
                {% if not loop.last %}

                {% endif %}
                {%- endfor -%}
                {%- endif -%}

      # ----------------------------------------------------------
      # 4. Dagelijkse herinnering toetsen / SO / mondeling
      # ----------------------------------------------------------
      - conditions:
          - condition: trigger
            id: dagelijkse_herinnering

          - condition: template
            value_template: >
              {%- set hw = state_attr(huiswerk_entity, 'huiswerk') or [] -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set deadline = (now() + timedelta(days=dagen | int)).strftime('%Y-%m-%d') -%}
              {%- set ns = namespace(n=0) -%}
              {%- for h in hw -%}
                {%- if h.start is defined and h.start[:10] >= today and h.start[:10] <= deadline
                      and h.type in ['toets', 'proeftoets', 'schoolexamen', 'mondeling'] -%}
                  {%- set ns.n = ns.n + 1 -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.n > 0 }}

        sequence:
          - service: "{{ notify }}"
            data:
              title: "📚 Aankomende toetsen – {{ naam }}"
              message: >
                {%- set hw = state_attr(huiswerk_entity, 'huiswerk') or [] -%}
                {%- set today = now().strftime('%Y-%m-%d') -%}
                {%- set deadline = (now() + timedelta(days=dagen | int)).strftime('%Y-%m-%d') -%}
                {%- set ns = namespace(items=[]) -%}
                {%- for h in hw -%}
                  {%- if h.start is defined and h.start[:10] >= today and h.start[:10] <= deadline
                        and h.type in ['toets', 'proeftoets', 'schoolexamen', 'mondeling'] -%}
                    {%- set ns.items = ns.items + [h] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set sorted_items = ns.items | sort(attribute='start') -%}
                {%- for h in sorted_items -%}
                {%- if h.type == 'schoolexamen' -%}🎓 SO
                {%- elif h.type == 'proeftoets' -%}📋 Proefwerk
                {%- elif h.type == 'mondeling' -%}🎤 Mondeling
                {%- else -%}📝 Toets
                {%- endif %} {{ h.subject }} — {{ as_local(as_datetime(h.start)).strftime('%d-%m %H:%M') -}}
                {%- if h.title %} | {{ h.title }}{% endif %}
                {%- if h.content %}
                📖 {{ h.content }}
                {%- elif h.description %}
                📖 {{ h.description }}
                {%- endif %}
                {% if not loop.last %}---
                {% endif %}
                {%- endfor %}

mode: queued
max: 5
